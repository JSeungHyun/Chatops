global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 알림 룰 로딩 (docker-compose에서 /etc/prometheus/rules.yml 로 마운트)
rule_files:
  - '/etc/prometheus/rules.yml'

scrape_configs:
  # ChatOps API (Spring Boot Actuator).
  # API는 docker-compose replicas:2 로 떠서 'api'가 여러 컨테이너 IP로 해석되므로,
  # static_configs(라운드로빈) 대신 dns_sd_configs로 모든 인스턴스를 개별 스크랩한다.
  - job_name: 'chatops-api'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    dns_sd_configs:
      - names: ['api']
        type: 'A'
        port: 3000

  # 호스트 시스템 메트릭 (CPU/메모리/디스크)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Prometheus 자체 메트릭
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
