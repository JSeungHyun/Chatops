spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/chatops
    username: ${DB_USERNAME:chatops}
    password: ${DB_PASSWORD:chatops}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      # FileService 상한과 정렬: 단일 파일 50MB(동영상), 요청 전체 55MB.
      # 미설정 시 Spring 기본값(파일 1MB/요청 10MB)이 실질 병목이 되어 파일 전송이 깨진다.
      max-file-size: 50MB
      max-request-size: 55MB
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:chatops-redis}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 3000

app:
  jwt:
    secret: ${JWT_SECRET:chatops-jwt-secret-key-for-dev-32b}
    expiration: 604800000
  minio:
    endpoint: minio
    port: 9000
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: chatops-files

logging:
  level:
    com.chatops: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: chatops-api
    distribution:
      # api_request_duration_seconds(p50/p95/p99) 산출용 히스토그램 버킷 활성화
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s
